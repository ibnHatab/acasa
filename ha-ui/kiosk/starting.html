<!doctype html>
<!-- starting.html (acasa ha-ui kiosk, 2026-11-24): what the screen shows while Home Assistant starts
     (a minute on a cold boot): Nina's boot logo at once instead of a black screen. firefox-kiosk.sh
     opens it, waits for Home Assistant, then opens the dashboard. Installed beside the logo in
     /usr/local/share/ha-pi-kiosk/. -->
<html><head><meta charset="utf-8"><title>Nina is waking up</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #b9a99b; font: 18px system-ui, sans-serif; cursor: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  img { width: 360px; height: 360px; border-radius: 50%; animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 50% { filter: brightness(1.18); } }
  p { margin: 0; letter-spacing: .04em; }
</style></head>
<body>
  <img src="logo.png" alt="">
  <p id="t">Nina is waking up…</p>
</body></html>
