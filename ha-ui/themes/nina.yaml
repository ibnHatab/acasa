# Nina's theme (2026-11-24): the home's character in colour: warm and low after dark, an amber
# glow for her, soft rounded cards. Both modes: a browser's scheme picks one; the kiosk's Firefox is set to dark (kiosk/firefox-kiosk.sh).
Nina:
  ha-card-border-radius: "20px"
  ha-card-box-shadow: "none"
  nina-orb: "#c96f2e"
  nina-orb-light: "#ffd9a8"
  assist-chat-display-radius: "18px"
  assist-chat-display-font-size: "17px"
  bubble-border-radius: "20px"
  modes:
    dark:
      primary-color: "#e0954f"
      accent-color: "#f2c27f"
      primary-background-color: "#12100e"
      secondary-background-color: "#1f1a16"
      card-background-color: "rgba(34, 28, 24, 0.82)"
      ha-card-background: "rgba(34, 28, 24, 0.82)"
      primary-text-color: "#f2ebe3"
      secondary-text-color: "#b5a596"
      divider-color: "rgba(242, 235, 227, 0.08)"
      lovelace-background: "radial-gradient(ellipse at 20% 0%, #3a2416 0%, #17120f 55%, #0d0b0a 100%) fixed"
      assist-chat-display-user-bubble-background: "#34414d"
      assist-chat-display-assistant-bubble-background: "#7a4a26"
      bubble-main-background-color: "rgba(46, 38, 32, 0.85)"
      bubble-secondary-background-color: "rgba(60, 48, 40, 0.85)"
      bubble-accent-color: "#e0954f"
    light:
      primary-color: "#b8642a"
      accent-color: "#d98c45"
      primary-background-color: "#f6f0e8"
      secondary-background-color: "#ece3d8"
      card-background-color: "rgba(255, 251, 246, 0.88)"
      ha-card-background: "rgba(255, 251, 246, 0.88)"
      primary-text-color: "#2b2420"
      secondary-text-color: "#7a6a5c"
      lovelace-background: "radial-gradient(ellipse at 20% 0%, #fbe6cc 0%, #f4ece2 60%, #efe6dc 100%) fixed"
      assist-chat-display-user-bubble-background: "#d9e3ec"
      assist-chat-display-user-bubble-color: "#1f2a33"
      assist-chat-display-assistant-bubble-background: "#f0cfa8"
      assist-chat-display-assistant-bubble-color: "#3a2412"
      bubble-main-background-color: "rgba(255, 248, 240, 0.9)"
      bubble-secondary-background-color: "rgba(240, 226, 210, 0.9)"
      bubble-accent-color: "#b8642a"
