# nina-live: the machine's settings, the person's preferences, the plugins.
# Relative paths are relative to this file; ~/ is the home directory.

key: ~/.config/fsttm/gemini.key # the AI Studio key's file (chmod 600); never the key here
charter: ~/repo/fsttm-live/testdata/charter-v2.txt
models:
  ears: gemini-3.5-transcribe-live # text only, under our endpointing
  mind: gemini-3.1-flash-live-preview # the voice+mind: text turns in, audio out
  vocab: [Nina, Prana, lab, bedroom, living room, ventilation, night mode, boost]
audio:
  # the laptop's own microphone and speakers while the ReSpeaker array is away (2026-11-26), PulseAudio's
  # echo canceller between them (live/pulse/echo-cancel-pulse.sh; as pero's). With the array back:
  #   device: hw:ArrayUAC10, channels: 6, speech: 0, ref: 5,
  #   out: pulse:alsa_output.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00.analog-stereo (its jack), and
  #   echo-cancel-pulse.sh off; MPD's sink back to the array's
  device: pulse:nina_ec_source # the laptop's microphone, her echo cancelled
  channels: 1
  speech: 0
  ref: -1 # no reference channel: the canceller works before she hears it
  out: pulse:nina_ec_sink # the laptop's speakers, through the canceller (its reference: her voice and the radio)
  level: -36 # her speech out, dBFS RMS, at a 1 m bubble: as loud at the array as the person (fsttm-live scripts/calib)
  vad_mode: 3
  hang: 700ms # silence that ends an utterance
  min_level: -60 # dBFS: quieter "voices" are not a person (the laptop, through the canceller: floor -78, her echo -74 median, -56 at most; 2026-11-26)
  barge_level: -52 # dBFS: a voice this loud over hers is the person's: she ducks at once (her echo there: -56 at most)
  max_utterance: 25s
dialog:
  follow_up: 30s # without her name, meant for her this long after she spoke; later: an aside (0: all, while awake)
  awake_for: 90s # asleep (and her session closed) after this long without a turn
  start_asleep: true
  note_gap: 2s # a NOTE waits for the floor to be free this long
  wake: # who hears her name
    mode: local # cloud: the transcriber; shadow: and the local spotter, logged; local: asleep, only what the spotter woke goes to the cloud
    engine: oww # openWakeWord, listening continuously (2026-11-26: sherpa's spotter, started per utterance, missed a bare "Nina")
    model: ~/repo/fsttm-live/models/oww # its shared models
    word: ~/repo/fsttm-live/models/oww/nina.onnx # Nina's own (trained on Paradee's voices)
    label: NINA
    kws: ~/models/sherpa-kws/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01 # sherpa's spotter alongside, per utterance:
    keywords: ~/repo/fsttm-live/testdata/kws-keywords.txt                    # her name before a sentence ("Nina, what time is it?":
    kws_threshold: 0.25                                                       # openWakeWord 0.02), 2026-11-26
    threshold: 0.3 # lower hears more (the log's oww_peak: each utterance's best score); 0.3: 0.28 false wakes an hour, the person's names at 0.34-0.94 (2026-11-26)
    # the sherpa spotter instead: engine: kws, model: ~/models/sherpa-kws/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01,
    # keywords: ~/repo/fsttm-live/testdata/kws-keywords.txt, threshold: 0.25
# SOURCES: the systems Nina draws on. Metis (metis-home): its tools, and its REASONING through the
# stream door (opened here). A line's kind gives its level: context (she knows it, says nothing),
# info / important / urgent (a NOTE: spoken when the floor and the narration knob allow), drop.
# A line carrying its own "level" (Metis's narration port) keeps it.
sources:
  metis:
    enabled: true
    tools: 127.0.0.1:8768
    door: 127.0.0.1:8766
    wait: 3s # for its tools at start; without them: a demo home
    levels: {result: context, noticed: info, surprise: info, error: context, env: context} # until Metis quantises them itself
# Changed at run time by the plugins (the web panel, the buttons) and written back here.
prefs:
  mic: false
  voice: false
  voice_name: Zephyr # a Live voice (Puck, Kore, Aoede, …); "" the model's
  local: "" # "" the Live audio; rhvoice (small machines), paradee (a desktop's socket): a local voice speaks her transcript
  rhvoice: slt
  paradee: af_heart
  narration: important # the lowest NOTE level spoken: info, important, urgent, off
  bubble: 1 # the one sound knob: metres her voice (and the music) carries; 1 the calibrated minimum, x2 +6 dB, up to 4
plugins:
  web: # the panel: preferences, status, the conversation; a kiosk's screen
    enabled: true
    addr: ":8770"
    allow_origin: ["http://homeassistant.local:8123", "https://nina-home.tail2ffd4d.ts.net:8443"] # the Pi's, local and from the tailnet (live/tailscale-serve.sh) # Home Assistant's Nina card reads her state and events, sets the mic and voice
    static: {"/nina/": ~/repo/acasa/ha-ui/www/nina, "/metis/": ~/repo/nina-live/catalog/domains/.metis} # her own screen, card and personas; the loop workspace (read only: the surprises card)
    remote: /nina/shell.html # from outside (Tailscale serve, live/tailscale-serve.sh): "/" is her own screen
  gpio: # buttons and lights on a Raspberry Pi (BCM line numbers)
    enabled: false
    chip: gpiochip0
    debounce: 30ms
    long_press: 1200ms
    buttons:
      - {line: 17, press: talk, long: sleep} # talk: wake her (or stop her if she speaks); long: sleep
      - {line: 27, press: mic} # the mic on and off
      - {line: 22, press: voice} # her sound on and off
    lights:
      - {line: 5, show: awake}
      - {line: 6, show: speaking}
