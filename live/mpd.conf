# MPD for Nina (acasa live/mpd.conf; install/machine.sh puts it in ~/.config/mpd/): a user service,
# internet radio and ~/Music, played through PulseAudio (PipeWire) on the machine's default output:
# the speakers (on the ReSpeaker array's jack, or a USB adapter's). Home Assistant's MPD integration
# talks to it on 127.0.0.1:6600; her music domain sets its volume from her voice's (nina.yaml
# music.curve: pulse, for the mixer below).
music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.local/share/mpd/database"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"
bind_to_address    "127.0.0.1"
port               "6600"
restore_paused     "yes"
auto_update        "yes"

audio_output {
    type       "pulse"
    name       "speakers"
    mixer_type "hardware"   # PulseAudio's stream volume: applied at the mix, heard at once (2026-11-25: the software
                            # mixer acts before MPD's output buffer, ~1 s late for her duck); none while stopped
}
