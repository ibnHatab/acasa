# The Raspberry Pi 4 (2026-11-24): the ReSpeaker on USB (card ArrayUAC10), playback on the default output until the speakers come; otherwise as pascal.yaml.
# nina-live: the machine's settings, the person's preferences, the plugins.
# Relative paths are relative to this file; ~/ is the home directory.

key: ~/.config/fsttm/gemini.key # the AI Studio key's file (chmod 600); never the key here
charter: ~/repo/fsttm-live/testdata/charter-v2.txt
models:
  ears: gemini-3.5-transcribe-live # text only, under our endpointing
  mind: gemini-3.1-flash-live-preview # the voice+mind: text turns in, audio out
  vocab: [Nina, Prana, lab, bedroom, living room, ventilation, night mode, boost]
audio:
  device: hw:ArrayUAC10 # capture: ALSA, or pulse:SOURCE
  channels: 6 # the ReSpeaker's 6-channel firmware
  speech: 0 # its processed speech channel
  ref: 5 # its echo reference channel (-1: none)
  out: "" # playback: aplay -D (plughw:ArrayUAC10: the ReSpeaker's jack), pulse:SINK; "" default
  vad_mode: 3
  hang: 700ms # silence that ends an utterance
  max_utterance: 25s
dialog:
  follow_up: 30s # without her name, meant for her this long after she spoke; later: an aside (0: all, while awake)
  awake_for: 90s # asleep (and her session closed) after this long without a turn
  start_asleep: true
  note_gap: 2s # a NOTE waits for the floor to be free this long
  wake: # who hears her name
    mode: local # cloud: the transcriber; shadow: and the local spotter, logged; local: asleep, only what the spotter woke goes to the cloud
    engine: oww # openWakeWord, listening continuously (2026-11-26: sherpa's spotter, started per utterance, missed a bare "Nina")
    model: ~/repo/fsttm-live/models/oww # its shared models
    word: ~/repo/fsttm-live/models/oww/nina.onnx # Nina's own (trained on Paradee's voices)
    label: NINA
    kws: ~/models/sherpa-kws/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01 # sherpa's spotter alongside, per utterance:
    keywords: ~/repo/fsttm-live/testdata/kws-keywords.txt                    # her name before a sentence ("Nina, what time is it?":
    kws_threshold: 0.25                                                       # openWakeWord 0.02), 2026-11-26
    threshold: 0.3 # lower hears more (the log's oww_peak: each utterance's best score); 0.3: 0.28 false wakes an hour, the person's names at 0.34-0.94 (2026-11-26)
    # the sherpa spotter instead: engine: kws, model: ~/models/sherpa-kws/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01,
    # keywords: ~/repo/fsttm-live/testdata/kws-keywords.txt, threshold: 0.25
