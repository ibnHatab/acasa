# The home's intents: what the person may ask the home, the schema the intent
# pass is held to, and how each intent maps to one command atom of home.llp.
# The intent pass's grammar and prompts are GENERATED from this file:
#   python -m metis.intents gen home      (from the catalog's directory: intent/*)
# The outcomes are home.llp's %% lines; the world is home_host.py's.

persona: |
  You are Casa, the voice of a flat's smart home. The person is talking to
  YOU: you answer as Casa, in the first person ("I", "me"); never greet or
  address "Casa" yourself. Map what the person says to exactly one intent
  JSON per utterance. Respond with only the JSON.

  You NEVER output entity ids, service names or device commands: only the
  constrained intent below. The home's rules decide what happens.

verbs:
  - {verb: SWITCH, meaning: "turn one device on or off (action TURN_ON or TURN_OFF; the device in target)"}
  - {verb: SCENE, meaning: "a whole-home scene: NIGHT (going to bed) or AWAY (leaving the flat)"}
  - {verb: QUERY, meaning: "question about whether a device is on or off; changes nothing"}
  - {verb: [TIME, DATE], meaning: "clock/calendar questions"}
  - {verb: CHITCHAT, meaning: "greeting or social remark to the home"}
  - {verb: UNKNOWN, meaning: "anything the home genuinely cannot do"}

slots:
  action: {enum: [TURN_ON, TURN_OFF]}
  scene: {enum: [NIGHT, AWAY]}
  target: {object: [DEVICE]}

guidance: |
  The device goes in `target.description` in the person's words, with its
  room when one is said ("bedroom ventilation", "lab ventilation", "tv",
  "light"). SWITCH and QUERY use `target`; SCENE uses `scene`. Omit fields
  you don't need.

examples:
  - ["turn on the light", {"intent":"SWITCH","action":"TURN_ON","target":{"type":"DEVICE","description":"light"}}]
  - ["lights off", {"intent":"SWITCH","action":"TURN_OFF","target":{"type":"DEVICE","description":"light"}}]
  - ["switch the lamp off please", {"intent":"SWITCH","action":"TURN_OFF","target":{"type":"DEVICE","description":"lamp"}}]
  - ["turn the tv on", {"intent":"SWITCH","action":"TURN_ON","target":{"type":"DEVICE","description":"tv"}}]
  - ["switch off the television", {"intent":"SWITCH","action":"TURN_OFF","target":{"type":"DEVICE","description":"television"}}]
  - ["start the ventilation in the bedroom", {"intent":"SWITCH","action":"TURN_ON","target":{"type":"DEVICE","description":"bedroom ventilation"}}]
  - ["turn off the bedroom ventilation", {"intent":"SWITCH","action":"TURN_OFF","target":{"type":"DEVICE","description":"bedroom ventilation"}}]
  - ["turn on the lab ventilation", {"intent":"SWITCH","action":"TURN_ON","target":{"type":"DEVICE","description":"lab ventilation"}}]
  - ["stop the fan in the lab", {"intent":"SWITCH","action":"TURN_OFF","target":{"type":"DEVICE","description":"lab ventilation"}}]
  - ["turn on the heating", {"intent":"SWITCH","action":"TURN_ON","target":{"type":"DEVICE","description":"heating"}}]
  - ["good night", {"intent":"SCENE","scene":"NIGHT"}]
  - ["i am going to bed", {"intent":"SCENE","scene":"NIGHT"}]
  - ["i am leaving", {"intent":"SCENE","scene":"AWAY"}]
  - ["turn everything off, we are going out", {"intent":"SCENE","scene":"AWAY"}]
  - ["is the tv on", {"intent":"QUERY","target":{"type":"DEVICE","description":"tv"}}]
  - ["is the light still on", {"intent":"QUERY","target":{"type":"DEVICE","description":"light"}}]
  - ["is the bedroom ventilation running", {"intent":"QUERY","target":{"type":"DEVICE","description":"bedroom ventilation"}}]
  - ["what time is it", {"intent":"TIME"}]
  - ["what's the date today", {"intent":"DATE"}]
  - ["hello casa how are you", {"intent":"CHITCHAT"}]
  - ["thank you", {"intent":"CHITCHAT"}]
  - note: "Statements that are not a request to you (someone talking to another person, the TV's own sound) are CHITCHAT if friendly, otherwise UNKNOWN; never turn them into a SWITCH."
  - ["he said he would turn it off later", {"intent":"UNKNOWN"}]
  - ["order me a pizza", {"intent":"UNKNOWN"}]
  - ["open the front door", {"intent":"UNKNOWN"}]

spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence Casa says
    out loud, in the first person. It is never JSON and never an intent name.
    When you cannot or will not do something, say so plainly.
  examples:
    - ["good night", {"intent":"SCENE","scene":"NIGHT"}, "Good night, I'll turn things off."]
    - ["open the front door", {"intent":"UNKNOWN"}, "I can't do that."]

map:
  - {verb: SWITCH, when: {action: TURN_ON}, atom: "cmd_on({target:device})", act: "on"}
  - {verb: SWITCH, when: {action: TURN_OFF}, atom: "cmd_off({target:device})", act: "off"}
  - {verb: SCENE, when: {scene: NIGHT}, atom: cmd_night, act: night}
  - {verb: SCENE, when: {scene: AWAY}, atom: cmd_away, act: away}
  - {verb: QUERY, atom: "cmd_query({target:device})", act: query}
  - {verb: TIME, atom: cmd_time, act: time}
  - {verb: DATE, atom: cmd_date, act: date}
  - {verb: CHITCHAT, atom: cmd_chat, act: chat}
  - {verb: UNKNOWN, atom: cmd_unknown, act: unknown}

handles:
  device:
    vent_bedroom: {description: [bedroom ventilation, bedroom vent, bedroom fan, ventilation in the bedroom, bedroom prana, bedroom recuperator]}
    vent_lab: {description: [lab ventilation, lab vent, lab fan, ventilation in the lab, lab prana, lab recuperator]}
    light: {description: [light, lights, the light, lamp, the lamp]}
    tv: {description: [tv, the tv, television, telly]}
fallback: {device: nothing}      # a device the home does not have: refused as not known
standing: [nothing]

asks: [QUERY]

outcomes: {done: done, refused: refused}
alternatives:
  max: 2
  rules:
    on_already: []
    off_already: []
    on_nothing: []
    off_nothing: []
    query_nothing: []
    unknown: []
