# The home (acasa): the devices of the flat as one metis domain. The program
# holds what the home believes about each device and decides every command;
# the host (home_host.py) is the only thing that talks to Home Assistant.
display: the home
line: "the flat's devices: the light, the TV and the two ventilation units; on, off, the night and away scenes"
voice: own
program: home.llp
host: home_host.py:make
intent: {spec: intent.yaml}   # the generated files at fixed names in intent/
clock: {beats: 1, period: 1}   # the world moves without the person: a device can change on its own
records: records/
